<div class="taxi-phrase">
    <div class="taxi-phrase__label">🚕 Show this to the taxi driver — {{ include.english }}</div>
    <div class="taxi-phrase__korean">{{ include.korean }}</div>
    {% if include.time %}
    <div class="taxi-phrase__meta">
        <span>Approx. time: {{ include.time }}</span>
    </div>
    {% endif %}
    {% if include.note %}<div class="taxi-phrase__note">{{ include.note }}</div>{% endif %}
</div>
