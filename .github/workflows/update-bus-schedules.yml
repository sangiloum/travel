name: Update bus schedules

on:
  schedule:
    # Mondays at 03:00 UTC / 12:00 Korea Standard Time.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-bus-schedules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install requests pyyaml

      - name: Update schedule data
        run: python scripts/update_schedules.py

      - name: Commit schedule changes
        run: |
          if git diff --quiet -- _data/schedules; then
            echo "No schedule changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/schedules
          git commit -m "Update bus schedules"
          git push
